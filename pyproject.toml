[project]
name = "relocation-rag"
version = "0.1.0"
description = "Question answering over a company relocation reimbursement policy."
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "sentence-transformers>=6.3.0",
    "torch>=2.15",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

# Containers run inference on CPU. Keep Linux installs free of CUDA runtimes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')" }]
