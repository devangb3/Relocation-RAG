name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"

      - name: Install locked dependencies
        run: uv sync --locked --python 3.13

      - name: Test
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

  container:
    name: Container indexing and retrieval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm -T rag relocation_rag.index
      - name: Query the persisted index from a fresh container
        run: |
          results=$(docker compose run --rm -T rag relocation_rag.retrieval "Which form do I use to request a relocation advance?")
          echo "$results"
          grep -F 'rel-101-transfer-approval/REL-105.1/' <<< "$results"
